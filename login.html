<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Only · Charlie's</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .login-box {
    max-width: 400px; margin: 40px auto; background: #FBF7F0;
    border: 1px dashed var(--latte); border-radius: 10px; padding: 28px;
  }
  .error-msg { color: #a33; font-size: 0.85rem; margin-bottom: 10px; display: none; }
  .toggle-text { 
    text-align: center; font-size: 0.85rem; margin-top: 16px; 
    font-family: 'Courier New', monospace; color: var(--cocoa); 
  }
  .toggle-text a { color: var(--espresso); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">Charlie's</a>
    <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="overlay">
      <span></span><span></span><span></span>
    </button>
  </div>
</div>

<nav class="overlay" id="overlay" aria-label="Main menu">
  <a href="index.html">Home</a>
  <a href="what-is.html">What is Charlie's Burger Joint?</a>
  <a href="members.html">Member List</a>
  <a href="profiles.html">Member Profiles</a>
  <a href="calendar.html">Group Calendar</a>
  <a href="locations.html">Locations</a>
  <a href="contact.html">Contact Us</a>
</nav>

<header class="page-head">
  <p class="kicker">Private Area</p>
  <h1>Staff Only</h1>
  <p class="lead" style="margin:16px auto 0;">Log in to see the secret menu.</p>
</header>

<main>
  <div class="wrap">
    <div class="login-box">
      <h3 id="form-title" style="font-weight:normal; margin-bottom:18px;">Log In</h3>
      <p id="error-msg" class="error-msg"></p>
      
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">

      <!-- Only shows if they are signing up -->
      <div id="name-field" style="display:none;">
        <label for="nickname">Nickname</label>
        <input type="text" id="nickname" placeholder="e.g. Nova">
      </div>

      <button type="button" id="action-btn" style="width:100%; margin-top:10px;">Enter</button>
      
      <p class="toggle-text">
        <span id="toggle-prompt">Need an account?</span> 
        <a id="toggle-link">Sign up here</a>
      </p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap"><p>Charlie's Burger Joint · eMzansi · Built with love and no photos</p></div>
</footer>

<script src="assets/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://yssyfxwvcdmqlulqsiem.supabase.co';
  const supabaseKey = 'sb_publishable_vEBQ5ObCGj5yotPFao4CXw_mqnQyVSf';
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  let isSignUp = false;
  
  const btn = document.getElementById('action-btn');
  const err = document.getElementById('error-msg');
  const formTitle = document.getElementById('form-title');
  const nameField = document.getElementById('name-field');
  const togglePrompt = document.getElementById('toggle-prompt');
  const toggleLink = document.getElementById('toggle-link');

  // Toggle between Log In and Sign Up
  toggleLink.addEventListener('click', () => {
    isSignUp = !isSignUp;
    err.style.display = 'none';
    
    if (isSignUp) {
      formTitle.textContent = 'Create Account';
      nameField.style.display = 'block';
      btn.textContent = 'Sign Up';
      togglePrompt.textContent = 'Already have an account?';
      toggleLink.textContent = 'Log in here';
    } else {
      formTitle.textContent = 'Log In';
      nameField.style.display = 'none';
      btn.textContent = 'Enter';
      togglePrompt.textContent = 'Need an account?';
      toggleLink.textContent = 'Sign up here';
    }
  });

  // Handle the button click
  btn.addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      err.textContent = 'Please enter both email and password.';
      err.style.display = 'block';
      return;
    }

    btn.textContent = 'Checking...';
    err.style.display = 'none';

    if (isSignUp) {
      // --- SIGN UP FLOW ---
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.textContent = 'Sign Up';
      } else {
        // If email confirmation is off, they are logged in immediately
        if (data.session) {
           window.location.href = 'confessions.html';
        } else {
           // If Supabase requires them to confirm email (even if you turned it off, some settings override)
           alert("Account created! You can now log in.");
           toggleLink.click(); // Switch back to login mode
        }
      }
    } else {
      // --- LOG IN FLOW ---
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.textContent = 'Enter';
      } else {
        window.location.href = 'confessions.html';
      }
    }
  });
</script>
</body>
</html>
