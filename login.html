<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Only · Charlie's</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">Charlie's</a>
  </div>
</div>

<main style="padding-top: 100px;">
  <div class="wrap" style="max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 20px;">Staff Login</h2>
    
    <div style="background: #FBF7F0; border: 1px dashed var(--latte); padding: 20px; border-radius: 10px;">
      <label>Email</label>
      <input type="email" id="email" style="width:100%; padding:10px; margin-bottom:15px;">
      
      <label>Password</label>
      <input type="password" id="password" style="width:100%; padding:10px; margin-bottom:15px;">
      
      <button type="button" onclick="doLogin()" style="width:100%; padding:12px; background:var(--cocoa); color:white; border:none; border-radius:5px;">Log In</button>
      
      <p id="msg" style="color: red; text-align: center; margin-top: 15px; font-size: 14px;"></p>
    </div>
  </div>
</main>

<!-- Load Supabase from unpkg instead of jsdelivr just in case -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
  // 1. Setup Supabase
  const supabaseUrl = 'https://yssyfxwvcdmqlulqsiem.supabase.co';
  const supabaseKey = 'sb_publishable_vEBQ5ObCGj5yotPFao4CXw_mqnQyVSf';
  
  // We use "var" instead of "const" here to prevent strict-mode errors on old phones
  var client = window.supabase.createClient(supabaseUrl, supabaseKey);

  // 2. The Login Function
  async function doLogin() {
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var msg = document.getElementById('msg');

    msg.textContent = "Connecting to Supabase..."; 
    msg.style.color = "black";

    try {
      var response = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (response.error) {
        msg.textContent = response.error.message;
        msg.style.color = "red";
      } else {
        msg.textContent = "Success! Redirecting...";
        msg.style.color = "green";
        window.location.href = 'confessions.html';
      }
    } catch (err) {
      msg.textContent = "System Error: " + err.message;
      msg.style.color = "red";
    }
  }
</script>
</body>
</html>
