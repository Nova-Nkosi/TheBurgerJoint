<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Did You Know? &middot; Charlie's</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .fact-card {
            background: var(--bg-surface);
            border-left: 3px solid var(--accent-gold);
            padding: 24px;
            margin-bottom: 16px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeUp 0.4s ease-out forwards;
        }
        .fact-card p {
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
        }
        .post-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 40px;
        }
        #loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="topbar">
        <div class="wrap">
            <a class="brand" href="index.html">Charlie's</a>
            <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="overlay">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>

    <nav class="overlay" id="overlay" aria-label="Main menu">
        <a href="index.html">Home</a>
        <a href="what-is.html">What is Charlie's Burger Joint?</a>
        <a href="members.html">Member List</a>
        <a href="profiles.html">Member Profiles</a>
        <a href="calendar.html">Group Calendar</a>
        <a href="facts.html" class="active">#DidYouKnow</a>
        <a href="locations.html">Locations</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <header class="page-head">
        <p class="kicker">The Bulletin Board</p>
        <h1>#DidYouKnow</h1>
        <p class="lead" style="margin: 16px auto 0;">Random facts, weird trivia, and things we just learned.</p>
    </header>

    <main>
        <div class="wrap">
            
            <div id="loading">Loading facts...</div>

            <div id="facts-area" style="display: none;">
                
                <!-- Form to add a new fact (No login required) -->
                <div class="post-box">
                    <label for="new-fact">Drop a random fact</label>
                    <textarea id="new-fact" placeholder="e.g. Honey never spoils..." style="margin-bottom: 16px;"></textarea>
                    <button type="button" id="submit-btn">Post Fact</button>
                </div>

                <div id="list-area">
                    <!-- JavaScript will fill this -->
                </div>

            </div>

        </div>
    </main>

    <footer>
        <div class="wrap">
            <p>Developed by Nova, 2026</p>
        </div>
    </footer>

    <script src="assets/nav.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        var supabaseUrl = 'https://yssyfxwvcdmqlulqsiem.supabase.co';
        var supabaseKey = 'sb_publishable_vEBQ5ObCGj5yotPFao4CXw_mqnQyVSf';
        var client = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- 1. LOAD FACTS ---
        async function loadFacts() {
            var { data, error } = await client
                .from('facts')
                .select('*')
                .order('created_at', { ascending: false });

            var list = document.getElementById('list-area');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('facts-area').style.display = 'block';

            if (error) {
                list.innerHTML = '<p style="color: var(--accent-brand);">Error loading: ' + error.message + '</p>';
                return;
            }

            if (data.length === 0) {
                list.innerHTML = '<p style="font-style: italic; color: var(--text-secondary);">No facts yet. Be the first to teach us something.</p>';
                return;
            }

            var htmlString = '';
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                htmlString += '<div class="fact-card"><p>' + item.content + '</p></div>';
            }
            list.innerHTML = htmlString;
        }

        // --- 2. POST A NEW FACT ---
        document.getElementById('submit-btn').addEventListener('click', async () => {
            var text = document.getElementById('new-fact').value;
            if (!text) return;

            var btn = document.getElementById('submit-btn');
            btn.textContent = 'Posting...';

            var { error } = await client
                .from('facts')
                .insert([ { content: text } ]);

            if (error) {
                alert("Error posting: " + error.message);
                btn.textContent = 'Post Fact';
            } else {
                document.getElementById('new-fact').value = '';
                btn.textContent = 'Post Fact';
                loadFacts(); // Refresh the list
            }
        });

        // Start loading
        loadFacts();
    </script>
</body>
</html>
